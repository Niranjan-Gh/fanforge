name: Windows checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run hardware-free tests
        run: python -m unittest discover -s tests -v
      - name: Build Windows executable
        run: ./build.ps1
