name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax check
        shell: pwsh
        run: python -m py_compile fanforge.py

      - name: Check tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $ver = (Select-String -Path fanforge.py -Pattern '^VERSION = "(.+)"').Matches[0].Groups[1].Value
          if ($tag -ne $ver) { throw "Tag v$tag does not match VERSION $ver in fanforge.py" }

      - name: Build exe
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./build.ps1

      - name: Checksum
        shell: pwsh
        run: (Get-FileHash dist/FanForge.exe -Algorithm SHA256).Hash | Out-File dist/FanForge.exe.sha256 -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: FanForge
          path: dist/FanForge.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/FanForge.exe
            dist/FanForge.exe.sha256
          generate_release_notes: true
